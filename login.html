<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in — HomeSync</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="marketplace.css" />
</head>
<body>
<div id="hs-header"></div>

<div class="container">
  <div class="card auth-card">
    <h2 style="margin-bottom:18px;font-weight:800">Log in to HomeSync</h2>
    <div class="auth-tabs" id="role-tabs">
      <button class="active" data-role="customer">Customer</button>
      <button data-role="worker">Worker</button>
      <button data-role="admin">Admin</button>
    </div>
    <form id="login-form">
      <div class="form-group">
        <label>Email</label>
        <input class="form-control" type="email" id="email" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input class="form-control" type="password" id="password" required />
      </div>
      <p id="error-msg" style="color:var(--danger);font-size:0.85rem;margin-bottom:12px;display:none"></p>
      <button class="btn btn-primary btn-block" type="submit">Log in</button>
    </form>
    <p style="margin-top:16px;font-size:0.85rem;text-align:center;color:var(--muted)">
      No account? <a href="register.html" style="color:var(--coop-teal-dark);font-weight:600">Register here</a>
    </p>
    <div class="card" style="margin-top:20px;background:var(--surface2);font-size:0.8rem;line-height:1.7">
      <b>Demo credentials</b><br/>
      Customer: customer@homesync.demo / demo1234<br/>
      Worker: worker1@homesync.demo / demo1234<br/>
      Admin: admin@homesync.demo / demo1234
    </div>
  </div>
</div>

<script type="module">
import "./js/ui.js";
import { login, currentUser } from "./js/store.js";

if (currentUser()) location.href = "index.html";

let role = "customer";
document.querySelectorAll("#role-tabs button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("#role-tabs button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    role = btn.dataset.role;
  });
});

document.getElementById("login-form").addEventListener("submit", (e) => {
  e.preventDefault();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const res = login(email, password, role);
  const errEl = document.getElementById("error-msg");
  if (!res.success) {
    errEl.textContent = res.error;
    errEl.style.display = "block";
    return;
  }
  if (role === "customer") location.href = "marketplace.html";
  else if (role === "worker") location.href = "worker-dashboard.html";
  else location.href = "admin-dashboard.html";
});
</script>
</body>
</html>
