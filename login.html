<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in — HomeSync</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="marketplace.css" />
</head>
<body>
<div id="hs-header"></div>

<div class="container section">
  <div class="card auth-card">
    <h2 style="margin-bottom:18px;font-weight:800;color:var(--coop-teal-dark)">Log in to HomeSync</h2>
    
    <div class="auth-tabs" id="role-tabs">
      <button class="active" data-role="customer">Customer</button>
      <button data-role="worker">Worker</button>
      <button data-role="admin">Admin</button>
    </div>

    <form id="login-form">
      <div class="form-group">
        <label>Email</label>
        <input class="form-control" type="email" id="email" value="customer@homesync.demo" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input class="form-control" type="password" id="password" value="demo1234" required />
      </div>
      <p id="error-msg" style="color:var(--danger);font-size:0.85rem;margin-bottom:12px;display:none"></p>
      <button class="btn btn-primary btn-block" type="submit">Log In</button>
    </form>

    <div style="margin-top:20px;border-top:1px solid var(--border);padding-top:16px">
      <b style="font-size:0.82rem;color:var(--muted);display:block;margin-bottom:8px;text-transform:uppercase;letter-spacing:0.04em">⚡ Quick 1-Click Demo Login:</b>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-ghost btn-sm" id="quick-cust" style="flex:1">Demo Customer</button>
        <button class="btn btn-ghost btn-sm" id="quick-work" style="flex:1">Demo Worker</button>
        <button class="btn btn-ghost btn-sm" id="quick-adm" style="flex:1">Demo Admin</button>
      </div>
    </div>

    <p style="margin-top:18px;font-size:0.85rem;text-align:center;color:var(--muted)">
      No account yet? <a href="register.html" style="color:var(--coop-teal-dark);font-weight:700">Register here</a>
    </p>
  </div>
</div>

<div class="footer"><div class="container">HomeSync — Cooperative-owned Digital Service Marketplace</div></div>

<script type="module">
import "./js/ui.js";
import { login, currentUser, qs } from "./js/store.js";

const redirectUrl = qs("redirect");

let role = "customer";
const creds = {
  customer: { email: "customer@homesync.demo", pass: "demo1234" },
  worker: { email: "worker1@homesync.demo", pass: "demo1234" },
  admin: { email: "admin@homesync.demo", pass: "demo1234" },
};

function selectRole(r) {
  role = r;
  document.querySelectorAll("#role-tabs button").forEach(b => b.classList.toggle("active", b.dataset.role === r));
  document.getElementById("email").value = creds[r].email;
  document.getElementById("password").value = creds[r].pass;
}

document.querySelectorAll("#role-tabs button").forEach(btn => {
  btn.addEventListener("click", () => selectRole(btn.dataset.role));
});

document.getElementById("quick-cust")?.addEventListener("click", () => doLogin("customer@homesync.demo", "demo1234", "customer"));
document.getElementById("quick-work")?.addEventListener("click", () => doLogin("worker1@homesync.demo", "demo1234", "worker"));
document.getElementById("quick-adm")?.addEventListener("click", () => doLogin("admin@homesync.demo", "demo1234", "admin"));

function doLogin(email, password, r) {
  const res = login(email, password, r);
  const errEl = document.getElementById("error-msg");
  if (!res.success) {
    errEl.textContent = res.error;
    errEl.style.display = "block";
    return;
  }
  if (redirectUrl) {
    location.href = redirectUrl;
    return;
  }
  if (r === "customer") location.href = "marketplace.html";
  else if (r === "worker") location.href = "worker-dashboard.html";
  else location.href = "admin-dashboard.html";
}

document.getElementById("login-form").addEventListener("submit", (e) => {
  e.preventDefault();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  doLogin(email, password, role);
});
</script>
</body>
</html>
