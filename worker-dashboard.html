<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Worker Dashboard — SevaSetu</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="marketplace.css" />
<style>
/* Additional Worker Dashboard Aesthetics */
.worker-header-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 14px;
  margin-bottom: 20px;
}
.duty-badge-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px;
  border-radius: 999px;
  font-weight: 700;
  font-size: 0.85rem;
  border: 1px solid var(--border);
  background: var(--surface);
}
.pulse-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  display: inline-block;
}
.pulse-dot.online {
  background: #10b981;
  box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.25);
  animation: pulse-green 1.8s infinite;
}
.pulse-dot.offline {
  background: #ef4444;
  box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.2);
}
@keyframes pulse-green {
  0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6); }
  70% { transform: scale(1.05); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
  100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
}

.job-card {
  position: relative;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: #fff;
  padding: 18px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 12px;
  box-shadow: var(--shadow-sm);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.job-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}
.job-card.emergency-job {
  border-color: rgba(220, 38, 38, 0.4);
  background: linear-gradient(180deg, #fff 0%, rgba(254, 242, 242, 0.5) 100%);
}
.emergency-strip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.75rem;
  font-weight: 800;
  color: #dc2626;
  background: #fee2e2;
  padding: 3px 8px;
  border-radius: 6px;
  letter-spacing: 0.5px;
}
.filter-chip-bar {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 18px;
  align-items: center;
}
.filter-chip {
  padding: 6px 14px;
  border-radius: 999px;
  border: 1px solid var(--border-strong);
  font-size: 0.82rem;
  font-weight: 600;
  cursor: pointer;
  background: #fff;
  transition: all 0.15s ease;
}
.filter-chip.active {
  background: var(--coop-teal-dark, #065f46);
  color: #fff;
  border-color: var(--coop-teal-dark, #065f46);
}
.customer-contact-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 9px;
  border-radius: 6px;
  border: 1px solid var(--border-strong);
  font-size: 0.78rem;
  color: var(--text);
  background: var(--surface2);
  text-decoration: none;
  cursor: pointer;
}
.customer-contact-btn:hover {
  background: var(--surface3);
}

/* Insurance Card Simulation */
.health-card {
  background: linear-gradient(135deg, #065f46, #047857);
  color: #fff;
  border-radius: 16px;
  padding: 24px;
  box-shadow: 0 10px 25px rgba(6, 95, 70, 0.25);
  position: relative;
  overflow: hidden;
}
.health-card::after {
  content: "SEVA COOP";
  position: absolute;
  right: -20px;
  bottom: -20px;
  font-size: 5rem;
  font-weight: 900;
  color: rgba(255, 255, 255, 0.06);
  pointer-events: none;
}

/* Upskilling course item */
.course-card {
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  background: #fff;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 10px;
}

/* Modal styling */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 16px;
}
.modal-content {
  background: #fff;
  border-radius: 16px;
  max-width: 480px;
  width: 100%;
  padding: 24px;
  box-shadow: var(--shadow-lg);
  position: relative;
  max-height: 90vh;
  overflow-y: auto;
}
.toast-notice {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: #065f46;
  color: #fff;
  padding: 12px 20px;
  border-radius: 10px;
  font-weight: 600;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
  z-index: 2000;
  display: flex;
  align-items: center;
  gap: 8px;
  animation: slide-up 0.3s ease;
}
@keyframes slide-up {
  from { transform: translateY(20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
</style>
</head>
<body>
<div id="hs-header"></div>

<div class="container section">
  <div id="verify-banner"></div>

  <div class="worker-header-bar">
    <div>
      <h1 style="font-weight:800;margin-bottom:4px">Worker Dashboard</h1>
      <p style="color:var(--muted);font-size:0.9rem" id="worker-headline">Cooperative Member Dispatch & Earning Center</p>
    </div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <div class="duty-badge-pill" id="duty-pill">
        <span class="pulse-dot online" id="duty-dot"></span>
        <span id="duty-text">Available for Dispatch</span>
      </div>
      <button class="btn btn-ghost btn-sm" id="quick-duty-toggle">Toggle Status</button>
      <button class="btn btn-primary btn-sm" id="btn-seed-data" title="Reset and populate 7 active demo jobs">⚡ Seed Fresh Demo Jobs</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="jobs">Jobs & Requests</button>
    <button class="tab-btn" data-tab="availability">Availability & Shift</button>
    <button class="tab-btn" data-tab="earnings">Earnings & Payout</button>
    <button class="tab-btn" data-tab="skills">Skills & Academy</button>
    <button class="tab-btn" data-tab="welfare">Welfare & Health</button>
    <button class="tab-btn" data-tab="profile">Profile & Rates</button>
  </div>

  <div class="tab-panel active" id="tab-jobs"></div>
  <div class="tab-panel" id="tab-availability"></div>
  <div class="tab-panel" id="tab-earnings"></div>
  <div class="tab-panel" id="tab-skills"></div>
  <div class="tab-panel" id="tab-welfare"></div>
  <div class="tab-panel" id="tab-profile"></div>
</div>

<div class="footer">
  <div class="container">SevaSetu — Cooperative-owned Digital Service Marketplace</div>
</div>

<!-- Modal Mount Point -->
<div id="modal-container"></div>
<div id="toast-container"></div>

<script type="module">
import "./js/ui.js";
import {
  currentWorkerProfile,
  getBookingsForWorker,
  updateBookingStatus,
  addBookingAdditionalCharges,
  recordWorkerPayout,
  enrollWorkerCourse,
  saveWorker,
  getCategory,
  CATEGORIES,
  currentUser,
  login,
  ensureWorkerDemoBookings
} from "./js/store.js";
import { money, badge, verificationBadge, stars } from "./js/ui.js";

// Toast helper
function showToast(msg, icon = "✓") {
  const container = document.getElementById("toast-container");
  const el = document.createElement("div");
  el.className = "toast-notice";
  el.innerHTML = `<span>${icon}</span> <span>${msg}</span>`;
  container.appendChild(el);
  setTimeout(() => {
    el.style.opacity = "0";
    el.style.transition = "opacity 0.3s";
    setTimeout(() => el.remove(), 300);
  }, 3200);
}

// Ensure logged in as worker demo user
let user = currentUser();
if (!user || user.role !== "worker") {
  const res = login("worker1@sevasetu.demo", "demo1234", "worker");
  if (res.success) user = res.user;
}

let worker = currentWorkerProfile();
if (!worker) {
  document.querySelector(".container.section").innerHTML = `
    <div class="card" style="max-width:500px;margin:40px auto;text-align:center;padding:36px 20px">
      <h2 style="margin-bottom:12px">Worker Sign In Required</h2>
      <p style="color:var(--muted);margin-bottom:20px">Please log in as a registered cooperative worker to view your job requests and earnings.</p>
      <a class="btn btn-primary btn-block" href="login.html">Log In as Worker</a>
    </div>`;
} else {
  initWorkerDashboard();
}

function initWorkerDashboard() {
  document.querySelectorAll(".tab-btn").forEach(btn => btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
    btn.classList.add("active");
    const panel = document.getElementById(`tab-${btn.dataset.tab}`);
    if (panel) panel.classList.add("active");
  }));

  const hashTab = location.hash.replace("#", "");
  if (hashTab) {
    const target = document.querySelector(`[data-tab="${hashTab}"]`);
    if (target) target.click();
  }

  // Quick header duty toggle button
  document.getElementById("quick-duty-toggle")?.addEventListener("click", () => {
    worker.availability = worker.availability === "available" ? "busy" : "available";
    saveWorker(worker);
    updateHeaderStatus();
    renderAvailability();
    showToast(`Status updated to ${worker.availability === "available" ? "Available" : "Busy"}`, "🔄");
  });

  // Demo seeder button in header
  document.getElementById("btn-seed-data")?.addEventListener("click", () => {
    ensureWorkerDemoBookings(worker.id, true);
    showToast("7 active demo jobs seeded for " + worker.name, "⚡");
    renderAll();
  });

  updateHeaderStatus();
  renderAll();
}

function updateHeaderStatus() {
  const dot = document.getElementById("duty-dot");
  const txt = document.getElementById("duty-text");
  const headline = document.getElementById("worker-headline");
  if (dot && txt) {
    if (worker.availability === "available") {
      dot.className = "pulse-dot online";
      txt.textContent = "Online & Ready";
    } else {
      dot.className = "pulse-dot offline";
      txt.textContent = "Busy / Off Duty";
    }
  }
  if (headline) {
    const cat = getCategory(worker.category);
    headline.textContent = `${worker.name} (${worker.cooperativeMemberId || "SEVA-COOP"}) · ${cat?.label || "Electrical"} · ${worker.serviceRadiusKm || 10} km dispatch zone`;
  }
}

function renderVerifyBanner() {
  const box = document.getElementById("verify-banner");
  if (!box) return;
  if (worker.verificationStatus !== "verified") {
    box.innerHTML = `<div class="card" style="background:var(--coop-amber-dim);margin-bottom:16px">
      ${verificationBadge(worker.verificationStatus)} Your profile is undergoing cooperative credentials review. New bookings can still be previewed in demo mode.
    </div>`;
  } else {
    box.innerHTML = "";
  }
}

const statusTone = {
  requested: "warn",
  accepted: "info",
  scheduled: "info",
  in_progress: "info",
  completed: "success",
  rejected: "danger",
  cancelled: "muted"
};

let currentJobFilter = "all";

function renderJobs() {
  const el = document.getElementById("tab-jobs");
  if (!el) return;

  const allBookings = getBookingsForWorker(worker.id);
  const requested = allBookings.filter(b => b.status === "requested");
  const inProgress = allBookings.filter(b => b.status === "in_progress");
  const accepted = allBookings.filter(b => b.status === "accepted" || b.status === "scheduled");
  const completed = allBookings.filter(b => b.status === "completed");

  let filtered = allBookings;
  if (currentJobFilter === "requested") filtered = requested;
  else if (currentJobFilter === "in_progress") filtered = inProgress;
  else if (currentJobFilter === "accepted") filtered = accepted;
  else if (currentJobFilter === "completed") filtered = completed;

  el.innerHTML = `
    <div class="filter-chip-bar">
      <span class="filter-chip ${currentJobFilter === "all" ? "active" : ""}" data-filter="all">All Jobs (${allBookings.length})</span>
      <span class="filter-chip ${currentJobFilter === "requested" ? "active" : ""}" data-filter="requested">
        🚨 Action Needed (${requested.length})
      </span>
      <span class="filter-chip ${currentJobFilter === "in_progress" ? "active" : ""}" data-filter="in_progress">
        ⚡ In Progress (${inProgress.length})
      </span>
      <span class="filter-chip ${currentJobFilter === "accepted" ? "active" : ""}" data-filter="accepted">
        📅 Scheduled (${accepted.length})
      </span>
      <span class="filter-chip ${currentJobFilter === "completed" ? "active" : ""}" data-filter="completed">
        ✓ Completed (${completed.length})
      </span>
    </div>

    ${filtered.length === 0 ? `
      <div class="empty-state">
        <div style="font-size:2.5rem;margin-bottom:10px">📋</div>
        <h3>No jobs found in this section</h3>
        <p style="color:var(--muted);margin:6px 0 16px">You currently have no jobs matching the selected filter.</p>
        <button class="btn btn-primary btn-sm" id="btn-seed-filter">⚡ Seed Fresh Demo Jobs</button>
      </div>` : `
      <div class="grid grid-2">
        ${filtered.map(b => {
          const statusStr = (b.status || "requested").replace("_", " ");
          const badgeTone = statusTone[b.status] || "muted";
          const extraCost = Number(b.additionalCharges) || 0;
          const totalFare = (Number(b.serviceCharge) || 0) + extraCost;
          const isEmergency = !!b.isEmergency;

          return `
          <div class="job-card ${isEmergency ? "emergency-job" : ""}">
            <div>
              <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px">
                <div>
                  <div style="display:flex;align-items:center;gap:8px">
                    <b style="font-size:1.05rem">${b.customerName || "Customer"}</b>
                    ${isEmergency ? `<span class="emergency-strip">🚨 EMERGENCY</span>` : ""}
                  </div>
                  <div style="color:var(--muted);font-size:0.83rem;margin-top:2px">
                    ${b.category || "Service"} · 📅 ${b.date || "Today"} · ⏰ ${b.time || "Immediate"}
                  </div>
                </div>
                ${badge(statusStr, badgeTone)}
              </div>

              <div style="font-size:0.85rem;color:var(--muted);margin-bottom:6px;display:flex;align-items:center;gap:6px">
                <span>📍 ${b.address || "Guwahati"}</span>
                ${b.distance ? `<span style="background:var(--surface3);padding:2px 6px;border-radius:4px;font-size:0.75rem">${b.distance}</span>` : ""}
              </div>

              <p style="font-size:0.88rem;margin:8px 0;line-height:1.45">${b.description || "Service request"}</p>

              ${b.details && typeof b.details === "object" && Object.keys(b.details).length ? `
                <div style="background:var(--surface2);padding:8px 12px;border-radius:8px;font-size:0.8rem;margin:8px 0;border:1px solid var(--border)">
                  ${Object.entries(b.details).filter(([,v]) => v).map(([k,v]) => `
                    <div style="margin-bottom:2px"><span style="color:var(--muted)">${k.replace(/([A-Z])/g, " $1")}:</span> <b>${v}</b></div>
                  `).join("")}
                </div>` : ""}

              <!-- Customer Communication Bar -->
              <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
                <button class="customer-contact-btn btn-call" data-name="${b.customerName || "Customer"}" data-phone="${b.customerPhone || "9864012345"}">
                  📞 Call (${b.customerPhone || "Customer"})
                </button>
                <button class="customer-contact-btn btn-chat" data-name="${b.customerName || "Customer"}" data-id="${b.id}">
                  💬 Quick Message
                </button>
                <button class="customer-contact-btn btn-map" data-address="${b.address || "Guwahati"}">
                  🗺️ Map & Route
                </button>
              </div>
            </div>

            <div style="border-top:1px solid var(--border);padding-top:12px;margin-top:6px">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
                <div>
                  <span style="font-size:0.78rem;color:var(--muted)">Total Fair Wage:</span>
                  <div style="font-size:1.15rem;font-weight:800;color:var(--coop-teal-dark)">
                    ${money(totalFare)}
                    ${extraCost > 0 ? `<small style="font-size:0.75rem;font-weight:600;color:var(--muted)">(includes ${money(extraCost)} parts)</small>` : ""}
                  </div>
                </div>
                ${b.status === "completed" ? `
                  <a href="invoice.html?booking=${b.id}" class="btn btn-ghost btn-sm" target="_blank">📄 View Invoice</a>
                ` : ""}
              </div>

              <!-- Action workflow buttons -->
              <div style="display:flex;gap:8px;flex-wrap:wrap">
                ${b.status === "requested" ? `
                  <button class="btn btn-primary btn-sm" data-act="accepted" data-id="${b.id}">✓ Accept Job</button>
                  <button class="btn btn-ghost btn-sm" data-act="rejected" data-id="${b.id}">✕ Decline</button>
                ` : ""}
                ${b.status === "accepted" || b.status === "scheduled" ? `
                  <button class="btn btn-primary btn-sm" data-act="in_progress" data-id="${b.id}">🚀 Start Job (On Site)</button>
                ` : ""}
                ${b.status === "in_progress" ? `
                  <button class="btn btn-primary btn-sm" data-act="completed" data-id="${b.id}">✅ Complete & Finalize</button>
                  <button class="btn btn-ghost btn-sm btn-add-parts" data-id="${b.id}">+ Add Spare Parts (₹)</button>
                ` : ""}
              </div>
            </div>
          </div>`;
        }).join("")}
      </div>
    `}
  `;

  // Filter chips click
  el.querySelectorAll(".filter-chip").forEach(chip => {
    chip.addEventListener("click", () => {
      currentJobFilter = chip.dataset.filter;
      renderJobs();
    });
  });

  // Seed button in empty state
  el.querySelector("#btn-seed-filter")?.addEventListener("click", () => {
    ensureWorkerDemoBookings(worker.id, true);
    showToast("7 active demo jobs seeded!", "⚡");
    renderJobs();
  });

  // Action buttons
  el.querySelectorAll("[data-act]").forEach(btn => {
    btn.addEventListener("click", () => {
      const act = btn.dataset.act;
      const bId = btn.dataset.id;
      updateBookingStatus(bId, act);
      if (act === "accepted") {
        showToast("Job accepted! Customer notified.", "✓");
      } else if (act === "in_progress") {
        showToast("Job started! You are now marked on duty.", "🚀");
      } else if (act === "completed") {
        showToast("Job completed! Invoice generated & earnings credited.", "🎉");
      } else if (act === "rejected") {
        showToast("Job request declined.", "ℹ️");
      }
      worker = currentWorkerProfile();
      updateHeaderStatus();
      renderAll();
    });
  });

  // Add spare parts button
  el.querySelectorAll(".btn-add-parts").forEach(btn => {
    btn.addEventListener("click", () => {
      openPartsModal(btn.dataset.id);
    });
  });

  // Call customer button
  el.querySelectorAll(".btn-call").forEach(btn => {
    btn.addEventListener("click", () => {
      const phone = btn.dataset.phone;
      const name = btn.dataset.name;
      openModal(`
        <h3 style="margin-bottom:12px">📞 Calling Customer</h3>
        <p style="margin-bottom:16px">Connecting voice call to <b>${name}</b> via cooperative privacy proxy.</p>
        <div style="background:var(--surface2);padding:14px;border-radius:10px;text-align:center;font-size:1.2rem;font-weight:700;margin-bottom:16px">
          ${phone}
        </div>
        <div style="display:flex;gap:10px;justify-content:flex-end">
          <button class="btn btn-ghost btn-sm" onclick="document.getElementById('modal-container').innerHTML=''">Close</button>
          <a class="btn btn-primary btn-sm" href="tel:${phone}">Open Phone Dialer</a>
        </div>
      `);
    });
  });

  // Chat message button
  el.querySelectorAll(".btn-chat").forEach(btn => {
    btn.addEventListener("click", () => {
      const name = btn.dataset.name;
      openModal(`
        <h3 style="margin-bottom:12px">💬 Message to ${name}</h3>
        <p style="font-size:0.85rem;color:var(--muted);margin-bottom:12px">Select a quick cooperative dispatch message to send:</p>
        <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px">
          <button class="btn btn-ghost btn-sm btn-quick-msg" style="text-align:left">🚗 I am on my way. Estimated arrival in 15 minutes.</button>
          <button class="btn btn-ghost btn-sm btn-quick-msg" style="text-align:left">📍 I have arrived outside your premises. Please provide gate access.</button>
          <button class="btn btn-ghost btn-sm btn-quick-msg" style="text-align:left">🛠️ Work in progress. Running final earthing and voltage check.</button>
        </div>
        <div class="form-group">
          <input class="form-control" id="custom-chat-msg" placeholder="Or type custom SMS / WhatsApp message..." />
        </div>
        <div style="display:flex;gap:10px;justify-content:flex-end">
          <button class="btn btn-ghost btn-sm" onclick="document.getElementById('modal-container').innerHTML=''">Cancel</button>
          <button class="btn btn-primary btn-sm" id="send-chat-btn">Send Message</button>
        </div>
      `);
      document.querySelectorAll(".btn-quick-msg").forEach(b => {
        b.addEventListener("click", () => {
          document.getElementById("custom-chat-msg").value = b.textContent;
        });
      });
      document.getElementById("send-chat-btn")?.addEventListener("click", () => {
        const val = document.getElementById("custom-chat-msg").value.trim();
        if (!val) return;
        closeModal();
        showToast(`Message sent to ${name}: "${val.slice(0, 28)}..."`, "💬");
      });
    });
  });

  // Map route button
  el.querySelectorAll(".btn-map").forEach(btn => {
    btn.addEventListener("click", () => {
      const addr = btn.dataset.address;
      openModal(`
        <h3 style="margin-bottom:12px">🗺️ Customer Location & Route</h3>
        <p style="margin-bottom:8px"><b>Address:</b> ${addr}</p>
        <p style="font-size:0.85rem;color:var(--muted);margin-bottom:16px">Estimated navigation time: <b>12–15 mins</b> (Normal traffic in Guwahati zone).</p>
        <div style="height:140px;background:linear-gradient(135deg, #e0f2fe, #bae6fd);border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#0369a1;margin-bottom:16px;border:1px dashed #38bdf8">
          📍 Map Preview: ${addr.split(",")[0]}
        </div>
        <div style="display:flex;gap:10px;justify-content:flex-end">
          <button class="btn btn-ghost btn-sm" onclick="document.getElementById('modal-container').innerHTML=''">Close</button>
          <a class="btn btn-primary btn-sm" href="https://maps.google.com/?q=${encodeURIComponent(addr)}" target="_blank">Open in Google Maps</a>
        </div>
      `);
    });
  });
}

function openPartsModal(bookingId) {
  openModal(`
    <h3 style="margin-bottom:12px">🔧 Add Spare Parts / Materials</h3>

function renderEarnings() {
  const el = document.getElementById("tab-earnings");
  if (!el) return;

  const bookings = getBookingsForWorker(worker.id).filter(b => b.status === "completed");
  const now = Date.now();
  const DAY = 86400000;

  const today = bookings.filter(b => now - (b.createdAt || 0) < DAY).reduce((s,b) => s + (Number(b.serviceCharge) || 0) + (Number(b.additionalCharges) || 0), 0);
  const week = bookings.filter(b => now - (b.createdAt || 0) < 7*DAY).reduce((s,b) => s + (Number(b.serviceCharge) || 0) + (Number(b.additionalCharges) || 0), 0);
  const month = bookings.filter(b => now - (b.createdAt || 0) < 30*DAY).reduce((s,b) => s + (Number(b.serviceCharge) || 0) + (Number(b.additionalCharges) || 0), 0);
  const total = bookings.reduce((s,b) => s + (Number(b.serviceCharge) || 0) + (Number(b.additionalCharges) || 0), 0);
  const welfareContribution = Math.round(total * 0.03); // 3% welfare fund
  const maxVal = Math.max(1, today, week, month, total);

  const payouts = Array.isArray(worker.payouts) ? worker.payouts : [];
  const totalWithdrawn = payouts.reduce((s, p) => s + (Number(p.amount) || 0), 0);

  el.innerHTML = `

      <div class="card stat-card">

        <div class="hs-bar-track" style="--bar-pct:100%"><div class="hs-bar-fill" style="background:var(--coop-amber)"></div></div>

    </div>

      <div>
        <div style="font-size:0.85rem;color:#166534;font-weight:700">AVAILABLE TO WITHDRAW</div>
        <div style="font-size:2rem;font-weight:900;color:#14532d">${money(availableBalance)}</div>
        <p style="font-size:0.8rem;color:#15803d;margin-top:2px">Direct settlement to UPI (${worker.bankDetails?.upi || "ramendas@oksbi"}) or SBI Bank A/C</p>

        <button class="btn btn-ghost btn-sm set-amt" data-val="500">₹500</button>
        <button class="btn btn-ghost btn-sm set-amt" data-val="1000">₹1,000</button>
        <button class="btn btn-ghost btn-sm set-amt" data-val="${balance}">All (${money(balance)})</button>
      </div>
    </div>

    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:20px">
      <button class="btn btn-ghost btn-sm" onclick="document.getElementById('modal-container').innerHTML=''">Cancel</button>
      <button class="btn btn-primary btn-sm" id="confirm-payout-btn">Confirm Payout Transfer</button>
    </div>
  `);

  document.querySelectorAll(".set-amt").forEach(b => {
    b.addEventListener("click", () => {
      document.getElementById("payout-amount").value = b.dataset.val;
    });
  });

  document.getElementById("confirm-payout-btn")?.addEventListener("click", () => {
    const amt = Number(document.getElementById("payout-amount").value);
    const dest = document.getElementById("payout-dest").value;
    if (!amt || amt <= 0 || amt > balance) {
      alert("Please enter a valid payout amount up to your available balance.");
      return;
    }
    recordWorkerPayout(worker.id, {
      amount: amt,
      method: dest.includes("UPI") ? "UPI" : "Bank Transfer",
      account: dest
    });
    closeModal();
    showToast(`Instant payout of ₹${amt.toLocaleString("en-IN")} transferred successfully!`, "💸");
    renderEarnings();
  });
}

function renderProfile() {
  const el = document.getElementById("tab-profile");
  if (!el) return;

  const bank = worker.bankDetails || {
    account: "9876543210123",
    ifsc: "SBIN0001234",
    bank: "State Bank of India (Guwahati)",
    upi: "ramendas@oksbi"
  };

  el.innerHTML = `
    <div class="grid grid-2">
      <div class="card">
        <h3 style="margin-bottom:12px">Cooperative Identity</h3>
        <p><b>Name:</b> ${worker.name}</p>
        <p><b>Member ID:</b> ${worker.cooperativeMemberId || "SEVA-COOP-1001"}</p>
        <p><b>Category:</b> ${getCategory(worker.category)?.label || "Electrical"}</p>
        <p><b>Rating:</b> ${stars(worker.rating || 4.9)} ${worker.rating || 4.9} (${worker.ratingCount || 38} reviews)</p>
        <p><b>Completed Jobs:</b> ${worker.completedJobs || 42}</p>
        <p><b>Experience:</b> ${worker.experience || 5} years</p>
        <p><b>Languages:</b> ${(worker.languages || ["Assamese", "Hindi", "English"]).join(", ")}</p>

        <h3 style="margin:20px 0 10px">Fair Wage Rate Card</h3>
        <div class="form-group">
          <label>Expected Base Rate (₹)</label>
          <input class="form-control" type="number" id="rate-input" value="${worker.expectedRate || 450}" />
          <small style="color:var(--muted)">Cooperative guideline: ₹300 – ₹1,000 for standard visits</small>
        </div>
      </div>

      <div class="card">
        <h3 style="margin-bottom:12px">Contact & Settlement Details</h3>
        <div class="form-group">
          <label>Phone Number</label>
          <input class="form-control" id="profile-phone" value="${worker.phone || "9800000003"}" />
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input class="form-control" id="profile-email" value="${worker.email || "worker1@sevasetu.demo"}" />
        </div>
        <div class="form-group">
          <label>UPI ID (for instant payouts)</label>
          <input class="form-control" id="profile-upi" value="${bank.upi || "ramendas@oksbi"}" />
        </div>
        <div class="form-group">
          <label>Bank Account Number</label>
          <input class="form-control" id="profile-acc" value="${bank.account || "9876543210123"}" />
        </div>
        <div class="form-group">
          <label>Bank IFSC Code</label>
          <input class="form-control" id="profile-ifsc" value="${bank.ifsc || "SBIN0001234"}" />
        </div>
        <button class="btn btn-primary btn-block" id="save-profile-btn">Save Profile Changes</button>
      </div>
    </div>`;

  document.getElementById("save-profile-btn")?.addEventListener("click", () => {
    worker.expectedRate = Number(document.getElementById("rate-input").value) || 450;
    worker.phone = document.getElementById("profile-phone").value.trim();
    worker.email = document.getElementById("profile-email").value.trim();
    if (!worker.bankDetails) worker.bankDetails = {};
    worker.bankDetails.upi = document.getElementById("profile-upi").value.trim();
    worker.bankDetails.account = document.getElementById("profile-acc").value.trim();
    worker.bankDetails.ifsc = document.getElementById("profile-ifsc").value.trim();
    saveWorker(worker);
    showToast("Profile & settlement details saved successfully!", "✓");
    updateHeaderStatus();
  });
}

function openModal(contentHtml) {
  const container = document.getElementById("modal-container");
  container.innerHTML = `
    <div class="modal-overlay" id="modal-backdrop">
      <div class="modal-content" onclick="event.stopPropagation()">
        ${contentHtml}
      </div>
    </div>`;
  document.getElementById("modal-backdrop")?.addEventListener("click", closeModal);
}

function closeModal() {
  const container = document.getElementById("modal-container");
  if (container) container.innerHTML = "";
}

function renderAll() {
  try {
    worker = currentWorkerProfile();
    updateHeaderStatus();
    renderVerifyBanner();
    renderJobs();
    renderAvailability();
    renderEarnings();
    renderSkills();
    renderWelfare();
    renderProfile();
  } catch (err) {
    console.error("Error in renderAll:", err);
  }
}

// Initial render
renderAll();
