<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cooperative Admin — SevaSetu</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="marketplace.css" />
<style>
/* Admin Specific Styles */
.admin-top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 20px;
}
.filter-chip-bar {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 16px;
  align-items: center;
}
.filter-chip {
  padding: 6px 13px;
  border-radius: 999px;
  border: 1px solid var(--border-strong);
  font-size: 0.82rem;
  font-weight: 600;
  cursor: pointer;
  background: #fff;
  transition: all 0.15s ease;
}
.filter-chip.active {
  background: var(--coop-teal-dark, #065f46);
  color: #fff;
  border-color: var(--coop-teal-dark, #065f46);
}

/* Modal styling */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.55);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 16px;
}
.modal-content {
  background: #fff;
  border-radius: 16px;
  max-width: 520px;
  width: 100%;
  padding: 24px;
  box-shadow: var(--shadow-lg);
  position: relative;
  max-height: 90vh;
  overflow-y: auto;
}
.modal-content.modal-cert {
  max-width: 660px;
}
.toast-notice {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: #065f46;
  color: #fff;
  padding: 12px 20px;
  border-radius: 10px;
  font-weight: 600;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
  z-index: 2000;
  display: flex;
  align-items: center;
  gap: 8px;
  animation: slide-up 0.3s ease;
}
@keyframes slide-up {
  from { transform: translateY(20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

/* Certificate Document Styling */
.certificate-doc {
  background: #fffefb;
  border: 8px solid #d97706;
  outline: 2px solid #b45309;
  outline-offset: -5px;
  border-radius: 14px;
  padding: 24px 20px;
  position: relative;
  text-align: center;
  box-shadow: 0 12px 36px rgba(0, 0, 0, 0.12);
  margin-bottom: 20px;
  color: #1e293b;
  overflow: hidden;
}
.certificate-doc::before {
  content: "SEVASETU VERIFIED";
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) rotate(-30deg);
  font-size: 2.5rem;
  font-weight: 900;
  color: rgba(217, 119, 6, 0.05);
  white-space: nowrap;
  pointer-events: none;
}
.cert-header-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(217, 119, 6, 0.12);
  color: #b45309;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.cert-title {
  font-size: 1.25rem;
  font-weight: 900;
  color: #0f172a;
  margin: 6px 0 2px;
  font-family: Georgia, serif;
}
.cert-recipient {
  font-size: 1.4rem;
  font-weight: 900;
  color: #065f46;
  border-bottom: 2px solid #d97706;
  display: inline-block;
  padding: 2px 24px;
  margin: 10px 0;
}
.cert-meta-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px 14px;
  margin: 14px 0;
  font-size: 0.8rem;
  text-align: left;
  background: rgba(0, 0, 0, 0.03);
  padding: 10px 14px;
  border-radius: 8px;
  border: 1px dashed rgba(217, 119, 6, 0.3);
}
.cert-signatures {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  margin-top: 16px;
  padding-top: 10px;
  border-top: 1px dashed #cbd5e1;
  font-size: 0.75rem;
  color: #64748b;
}
.cert-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 10px;
  border-radius: 8px;
  border: 1px solid var(--border-strong);
  font-size: 0.78rem;
  font-weight: 600;
  background: var(--surface2);
  cursor: pointer;
  transition: all 0.15s ease;
  color: var(--text);
}
.cert-pill:hover {
  background: var(--surface3);
  border-color: var(--coop-teal);
  color: var(--coop-teal-dark);
}
.audit-checkpoint {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 0.84rem;
  padding: 6px 10px;
  background: #f8fafc;
  border-radius: 6px;
  margin-bottom: 6px;
  border: 1px solid #e2e8f0;
}
</style>
</head>

// Toast Notification
function showToast(msg, icon = "✓") {
  const container = document.getElementById("toast-container");
  const el = document.createElement("div");
  el.className = "toast-notice";
  el.innerHTML = `<span>${icon}</span> <span>${msg}</span>`;
  container.appendChild(el);
  setTimeout(() => {
    el.style.opacity = "0";
    el.style.transition = "opacity 0.3s";
    setTimeout(() => el.remove(), 300);
  }, 3200);
}

// Modal functions
function openModal(html, extraClass = "") {
  const container = document.getElementById("modal-container");
  container.innerHTML = `
    <div class="modal-overlay" id="modal-backdrop">
      <div class="modal-content ${extraClass}" onclick="event.stopPropagation()">
        ${html}
      </div>
    </div>`;
  document.getElementById("modal-backdrop")?.addEventListener("click", closeModal);
}
function closeModal() {
  const container = document.getElementById("modal-container");
  if (container) container.innerHTML = "";
}

function initAdminDashboard() {
  function switchTab(tabKey) {
    if (!tabKey) return;
    const btn = document.querySelector(`.tab-btn[data-tab="${tabKey}"]`);
    const panel = document.getElementById(`tab-${tabKey}`);
    if (btn && panel) {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
      btn.classList.add("active");
      panel.classList.add("active");
    }
  }

  document.querySelectorAll(".tab-btn").forEach(btn => btn.addEventListener("click", () => {
    switchTab(btn.dataset.tab);
    if (location.hash !== "#" + btn.dataset.tab) {
      history.replaceState(null, "", "#" + btn.dataset.tab);
    }
  }));

  window.addEventListener("hashchange", () => {
    const hashTab = (location.hash || "").replace("#", "").trim();
    if (hashTab) switchTab(hashTab);
  });

  const hashTab = (location.hash || "").replace("#", "").trim();
  if (hashTab) {
    switchTab(hashTab);
  }

  document.getElementById("btn-seed-admin-data")?.addEventListener("click", () => {
    ensureAdminDemoData(true);
    showToast("Fresh admin demo data seeded!", "⚡");
    renderAll();
  });

  renderAll();
}

function renderStats() {
  try {
    const s = adminStats();
    const cards = [
      ["Total Workers", s.totalWorkers],
      ["Verified Workers", s.verifiedWorkers],
      ["Pending Verification", s.pendingVerification],
      ["Total Customers", s.totalCustomers],
      ["Active Bookings", s.activeBookings],
      ["Completed Bookings", s.completedBookings],
      ["Emergency Requests", s.emergencyRequests],
      ["Total Revenue", money(s.totalRevenue)],
    ];
    document.getElementById("stats-grid").innerHTML = cards
      .map(([l, v]) => `
        <div class="card stat-card">
          <div class="stat-value">${v}</div>
          <div class="stat-label">${l}</div>
        </div>
      `).join("");
  } catch (err) {
    console.error("renderStats error:", err);
  }
}

// Workers Directory state
let workerSearchQuery = "";
let workerCategoryFilter = "all";
let workerStatusFilter = "all";

function renderWorkers() {
  const el = document.getElementById("tab-workers");
  if (!el) return;

  try {
    const workers = getWorkers();
    let filtered = workers.filter(w => {
      const matchSearch = !workerSearchQuery ||
        (w.name || "").toLowerCase().includes(workerSearchQuery) ||
        (w.cooperativeMemberId || "").toLowerCase().includes(workerSearchQuery);
      const matchCat = workerCategoryFilter === "all" || w.category === workerCategoryFilter;
      const matchStatus = workerStatusFilter === "all" || w.verificationStatus === workerStatusFilter;
      return matchSearch && matchCat && matchStatus;
    });

    el.innerHTML = `
      <div class="filters-bar" style="margin-bottom:16px">
        <input type="text" id="worker-search" placeholder="Search by name or Member ID..." value="${workerSearchQuery}" style="flex:1;min-width:200px" />
        <select id="worker-cat-filter">
          <option value="all">All Categories</option>
          ${CATEGORIES.map(c => `<option value="${c.id}" ${workerCategoryFilter === c.id ? "selected" : ""}>${c.label}</option>`).join("")}
        </select>
        <select id="worker-status-filter">
          <option value="all" ${workerStatusFilter === "all" ? "selected" : ""}>All Statuses</option>
          <option value="verified" ${workerStatusFilter === "verified" ? "selected" : ""}>Verified</option>
          <option value="pending" ${workerStatusFilter === "pending" ? "selected" : ""}>Pending</option>
          <option value="under_review" ${workerStatusFilter === "under_review" ? "selected" : ""}>Under Review</option>
        </select>
      </div>

      ${filtered.length === 0 ? `
        <div class="empty-state">No workers match the selected filters.</div>

          <thead>
            <tr>
              <th>Member Name</th>
              <th>Category</th>
              <th>Cooperative ID</th>
              <th>Rating</th>
              <th>Completed Jobs</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            ${filtered.map(w => `
              <tr>
                <td><b>${w.name}</b></td>
                <td>${getCategory(w.category)?.label || w.category}</td>

const statusTone = {
  requested: "warn",
  accepted: "info",
  scheduled: "info",
  in_progress: "info",
  completed: "success",
  rejected: "danger",
  cancelled: "muted"
};

let bookingFilter = "all";

function renderBookings() {
  const el = document.getElementById("tab-bookings");
  if (!el) return;

  try {
    const allBookings = getBookings().sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    let filtered = allBookings;
    if (bookingFilter === "emergency") filtered = allBookings.filter(b => b.isEmergency);
    else if (bookingFilter === "active") filtered = allBookings.filter(b => ["requested", "accepted", "in_progress", "scheduled"].includes(b.status));
    else if (bookingFilter === "completed") filtered = allBookings.filter(b => b.status === "completed");

    el.innerHTML = `
      <div class="filter-chip-bar">
        <span class="filter-chip ${bookingFilter === "all" ? "active" : ""}" data-bf="all">All Bookings (${allBookings.length})</span>
        <span class="filter-chip ${bookingFilter === "emergency" ? "active" : ""}" data-bf="emergency">🚨 Emergency (${allBookings.filter(b => b.isEmergency).length})</span>
        <span class="filter-chip ${bookingFilter === "active" ? "active" : ""}" data-bf="active">⚡ Active / In Progress (${allBookings.filter(b => ["requested", "accepted", "in_progress", "scheduled"].includes(b.status)).length})</span>
        <span class="filter-chip ${bookingFilter === "completed" ? "active" : ""}" data-bf="completed">✓ Completed (${allBookings.filter(b => b.status === "completed").length})</span>
      </div>

      <table class="hs-table">
        <thead>
          <tr>
            <th>Customer</th>
            <th>Worker</th>
            <th>Category</th>
            <th>Date</th>
            <th>Amount</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          ${filtered.slice(0, 60).map(b => {
            const st = b.status ? b.status.replace("_", " ") : "pending";
            const tone = statusTone[b.status] || "muted";
            return `
            <tr>
              <td><b>${b.customerName || "Customer"}</b></td>
              <td>${b.workerName || "Worker"}</td>
              <td>${b.category || "Service"}${b.isEmergency ? " 🚨" : ""}</td>
              <td>${b.date || "Recent"}</td>
              <td style="font-weight:700">${money(b.serviceCharge || 0)}</td>
              <td>${badge(st, tone)}</td>
              <td><a href="invoice.html?booking=${b.id}" class="btn btn-ghost btn-sm" target="_blank">📄 Invoice</a></td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>
    `;

    el.querySelectorAll("[data-bf]").forEach(chip => {
      chip.addEventListener("click", () => {
        bookingFilter = chip.dataset.bf;
        renderBookings();
      });
    });
  } catch (err) {
    console.error("renderBookings error:", err);
  }
}

            <select class="form-control" id="disp-action">
              <option value="Worker revisited and corrected issue free of charge. Customer satisfied.">Worker Revisited & Fixed Without Fee</option>
              <option value="Cancellation charge waived due to unavoidable weather delay.">Waived Cancellation Fee</option>
              <option value="Material billing discrepancy adjusted and refunded.">Refunded Material Discrepancy</option>
              <option value="Mediation completed with mutual agreement.">Mutual Cooperative Mediation</option>
            </select>
          </div>
          <div style="display:flex;gap:10px;justify-content:flex-end">
            <button class="btn btn-ghost btn-sm" onclick="document.getElementById('modal-container').innerHTML=''">Cancel</button>
            <button class="btn btn-primary btn-sm" id="btn-confirm-disp">Apply Resolution</button>
          </div>
        `);
        document.getElementById("btn-confirm-disp")?.addEventListener("click", () => {
          const actionNote = document.getElementById("disp-action").value;
          resolveDispute(btn.dataset.id, actionNote);
          closeModal();
          showToast("Dispute marked resolved!", "✓");
          renderDisputes();
        });
      });
    });

    el.querySelectorAll(".btn-credit-disp").forEach(btn => {
      btn.addEventListener("click", () => {
        resolveDispute(btn.dataset.id, "Issued ₹150 platform courtesy credit to customer.");
        showToast("Courtesy credit issued & dispute resolved!", "💳");
        renderDisputes();
      });
    });
  } catch (err) {
    console.error("renderDisputes error:", err);
  }
}

function renderCategories() {
  const el = document.getElementById("tab-categories");
  if (!el) return;

  try {
    const bookings = getBookings();
    const configs = getAllCategoryConfigs();

    el.innerHTML = `
      <p class="ai-note" style="margin-bottom:16px">Cooperative categories and fair-wage settings. Changes update live across the marketplace without code deploys.</p>
      <div class="grid grid-2">
        ${configs.map(c => `
          <div class="card" style="border-top:4px solid ${c.theme?.accent || "#065f46"}">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <b>${c.icon || "🛠️"} ${c.label}</b>
              ${badge(c.active ? "Active" : "Deactivated", c.active ? "success" : "muted")}
            </div>
            <div class="form-group" style="margin-top:10px">
              <label>Tagline</label>
              <input class="form-control" data-cat="${c.id}" data-field="tagline" value="${c.tagline || ""}" />
            </div>
            <div class="form-group">
              <label>Description</label>
              <textarea class="form-control" data-cat="${c.id}" data-field="description">${c.description || ""}</textarea>
            </div>
            <div class="form-group">
              <label>Accent Color</label>
              <input type="color" data-cat="${c.id}" data-field="accent" value="${c.theme?.accent || "#065f46"}" style="width:60px;height:36px;padding:2px" />
            </div>
            <div style="display:flex;gap:8px;margin-top:10px">
              <button class="btn btn-primary btn-sm" data-save="${c.id}">Save Changes</button>
              <button class="btn btn-ghost btn-sm" data-toggle="${c.id}">${c.active ? "Deactivate" : "Reactivate"}</button>
            </div>
            ${!canDeleteCategory(c.id, bookings) ? `
              <p style="font-size:0.78rem;color:var(--muted);margin-top:6px">Category has historical bookings (deactivation preserved).</p>
            ` : ""}
          </div>
        `).join("")}
      </div>
    `;

    el.querySelectorAll("[data-save]").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = btn.dataset.save;
        const card = btn.closest(".card");
        const tagline = card.querySelector('[data-field="tagline"]').value;
        const description = card.querySelector('[data-field="description"]').value;
        const accent = card.querySelector('[data-field="accent"]').value;
        saveCategoryOverride(id, { tagline, description, theme: { accent } });
        showToast("Category settings updated live!", "✓");
        renderAll();
      });
    });

    el.querySelectorAll("[data-toggle]").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = btn.dataset.toggle;
        const cfg = configs.find(c => c.id === id);
        if (cfg) {
          setCategoryActive(id, !cfg.active);
          showToast(`Category ${!cfg.active ? "reactivated" : "deactivated"}`, "🔄");
          renderAll();
        }
      });
    });
  } catch (err) {
    console.error("renderCategories error:", err);
  }
}

function renderAll() {
  renderStats();
  renderWorkers();
  renderVerification();
  renderBookings();
  renderPayments();
  renderWelfare();
  renderForecast();
  renderAnalytics();
  renderDisputes();
  renderCategories();
}

// Initial render
renderAll();
</script>
</body>
</html>
