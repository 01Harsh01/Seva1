<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cooperative Admin — SevaSetu</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="marketplace.css" />
<style>
/* Admin Specific Styles */
.admin-top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 20px;
}
.filter-chip-bar {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 16px;
  align-items: center;
}
.filter-chip {
  padding: 6px 13px;
  border-radius: 999px;
  border: 1px solid var(--border-strong);
  font-size: 0.82rem;
  font-weight: 600;
  cursor: pointer;
  background: #fff;
  transition: all 0.15s ease;
}
.filter-chip.active {
  background: var(--coop-teal-dark, #065f46);
  color: #fff;
  border-color: var(--coop-teal-dark, #065f46);
}

/* Modal styling */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.55);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 16px;
}
.modal-content {
  background: #fff;
  border-radius: 16px;
  max-width: 520px;
  width: 100%;
  padding: 24px;
  box-shadow: var(--shadow-lg);
  position: relative;
  max-height: 90vh;
  overflow-y: auto;
}
.toast-notice {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: #065f46;
  color: #fff;
  padding: 12px 20px;
  border-radius: 10px;
  font-weight: 600;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
  z-index: 2000;
  display: flex;
  align-items: center;
  gap: 8px;
  animation: slide-up 0.3s ease;
}
@keyframes slide-up {
  from { transform: translateY(20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
</style>
</head>
<body>
<div id="hs-header"></div>

<div class="container section">
  <div class="admin-top-bar">
    <div>
      <h1 style="font-weight:800;margin-bottom:4px">Cooperative Administration</h1>
      <p style="color:var(--muted);font-size:0.9rem">Federation Operations, Worker Welfare, Dispatch & Financial Governance</p>
    </div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <span class="badge badge-success">● Federation Node Online</span>
      <button class="btn btn-primary btn-sm" id="btn-seed-admin-data" title="Populate fresh demo bookings, disputes, and welfare claims">
        ⚡ Seed Fresh Admin Demo Data
      </button>
    </div>
  </div>

  <div class="grid grid-4" id="stats-grid" style="margin-bottom:24px"></div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="workers">Workers Directory</button>
    <button class="tab-btn" data-tab="verification">Verification Queue</button>
    <button class="tab-btn" data-tab="bookings">Bookings Ledger</button>
    <button class="tab-btn" data-tab="payments">Payments & Fees</button>
    <button class="tab-btn" data-tab="welfare">Welfare & Social Security</button>
    <button class="tab-btn" data-tab="forecast">Demand Forecast</button>
    <button class="tab-btn" data-tab="analytics">AI Workforce</button>
    <button class="tab-btn" data-tab="disputes">Disputes & Grievances</button>
    <button class="tab-btn" data-tab="categories">Categories & Wages</button>
  </div>

  <div class="tab-panel active" id="tab-workers"></div>
  <div class="tab-panel" id="tab-verification"></div>
  <div class="tab-panel" id="tab-bookings"></div>
  <div class="tab-panel" id="tab-payments"></div>
  <div class="tab-panel" id="tab-welfare"></div>
  <div class="tab-panel" id="tab-forecast"></div>
  <div class="tab-panel" id="tab-analytics"></div>
  <div class="tab-panel" id="tab-disputes"></div>
  <div class="tab-panel" id="tab-categories"></div>
</div>

<div class="footer">
  <div class="container">SevaSetu — Cooperative-owned Digital Service Marketplace</div>
</div>

<!-- Modal Mount Point -->
<div id="modal-container"></div>
<div id="toast-container"></div>

<script type="module">
import "./js/ui.js";
import {
  adminStats,
  getWorkers,
  getWorkerById,
  setWorkerVerification,
  getBookings,
  getPayments,
  updateWelfare,
  getWelfareClaims,
  updateWelfareClaim,
  demandForecast,
  workforceAllocation,
  getDisputes,
  resolveDispute,
  getCategory,
  CATEGORIES,
  currentUser,
  login,
  ensureAdminDemoData
} from "./js/store.js";
import { getAllCategoryConfigs, saveCategoryOverride, setCategoryActive, canDeleteCategory } from "./js/categoryConfig.js";
import { money, badge, verificationBadge, stars } from "./js/ui.js";

// Toast Notification
function showToast(msg, icon = "✓") {
  const container = document.getElementById("toast-container");
  const el = document.createElement("div");
  el.className = "toast-notice";
  el.innerHTML = `<span>${icon}</span> <span>${msg}</span>`;
  container.appendChild(el);
  setTimeout(() => {
    el.style.opacity = "0";
    el.style.transition = "opacity 0.3s";
    setTimeout(() => el.remove(), 300);
  }, 3200);
}

// Modal functions
function openModal(html) {
  const container = document.getElementById("modal-container");
  container.innerHTML = `
    <div class="modal-overlay" id="modal-backdrop">
      <div class="modal-content" onclick="event.stopPropagation()">
        ${html}
      </div>
    </div>`;
  document.getElementById("modal-backdrop")?.addEventListener("click", closeModal);
}
function closeModal() {
  const container = document.getElementById("modal-container");
  if (container) container.innerHTML = "";
}

// Ensure logged in as admin
let user = currentUser();
if (!user || user.role !== "admin") {
  const res = login("admin@sevasetu.demo", "demo1234", "admin");
  if (res.success) user = res.user;
}

if (!user) {
  document.querySelector(".container.section").innerHTML = `
    <div class="card" style="max-width:500px;margin:40px auto;text-align:center;padding:36px 20px">
      <h2 style="margin-bottom:12px">Cooperative Admin Access</h2>
      <p style="color:var(--muted);margin-bottom:20px">Please log in with administrator credentials to manage federation operations.</p>
      <a class="btn btn-primary btn-block" href="login.html">Log In as Admin</a>
    </div>`;
} else {
  initAdminDashboard();
}

function initAdminDashboard() {
  function switchTab(tabKey) {
    if (!tabKey) return;
    const btn = document.querySelector(`.tab-btn[data-tab="${tabKey}"]`);
    const panel = document.getElementById(`tab-${tabKey}`);
    if (btn && panel) {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
      btn.classList.add("active");
      panel.classList.add("active");
    }
  }

  document.querySelectorAll(".tab-btn").forEach(btn => btn.addEventListener("click", () => {
    switchTab(btn.dataset.tab);
    if (location.hash !== "#" + btn.dataset.tab) {
      history.replaceState(null, "", "#" + btn.dataset.tab);
    }
  }));

  window.addEventListener("hashchange", () => {
    const hashTab = (location.hash || "").replace("#", "").trim();
    if (hashTab) switchTab(hashTab);
  });

  const hashTab = (location.hash || "").replace("#", "").trim();
  if (hashTab) {
    switchTab(hashTab);
  }

  document.getElementById("btn-seed-admin-data")?.addEventListener("click", () => {
    ensureAdminDemoData(true);
    showToast("Fresh admin demo data seeded!", "⚡");
    renderAll();
  });

  renderAll();
}

function renderStats() {
  try {
    const s = adminStats();
    const cards = [
      ["Total Workers", s.totalWorkers],
      ["Verified Workers", s.verifiedWorkers],
      ["Pending Verification", s.pendingVerification],
      ["Total Customers", s.totalCustomers],
      ["Active Bookings", s.activeBookings],
      ["Completed Bookings", s.completedBookings],
      ["Emergency Requests", s.emergencyRequests],
      ["Total Revenue", money(s.totalRevenue)],
    ];
    document.getElementById("stats-grid").innerHTML = cards
      .map(([l, v]) => `
        <div class="card stat-card">
          <div class="stat-value">${v}</div>
          <div class="stat-label">${l}</div>
        </div>
      `).join("");
  } catch (err) {
    console.error("renderStats error:", err);
  }
}

// Workers Directory state
let workerSearchQuery = "";
let workerCategoryFilter = "all";
let workerStatusFilter = "all";

function renderWorkers() {
  const el = document.getElementById("tab-workers");
  if (!el) return;

  try {
    const workers = getWorkers();
    let filtered = workers.filter(w => {
      const matchSearch = !workerSearchQuery ||
        (w.name || "").toLowerCase().includes(workerSearchQuery) ||
        (w.cooperativeMemberId || "").toLowerCase().includes(workerSearchQuery);
      const matchCat = workerCategoryFilter === "all" || w.category === workerCategoryFilter;
      const matchStatus = workerStatusFilter === "all" || w.verificationStatus === workerStatusFilter;
      return matchSearch && matchCat && matchStatus;
    });

    el.innerHTML = `
      <div class="filters-bar" style="margin-bottom:16px">
        <input type="text" id="worker-search" placeholder="Search by name or Member ID..." value="${workerSearchQuery}" style="flex:1;min-width:200px" />
        <select id="worker-cat-filter">
          <option value="all">All Categories</option>
          ${CATEGORIES.map(c => `<option value="${c.id}" ${workerCategoryFilter === c.id ? "selected" : ""}>${c.label}</option>`).join("")}
        </select>
        <select id="worker-status-filter">
          <option value="all" ${workerStatusFilter === "all" ? "selected" : ""}>All Statuses</option>
          <option value="verified" ${workerStatusFilter === "verified" ? "selected" : ""}>Verified</option>
          <option value="pending" ${workerStatusFilter === "pending" ? "selected" : ""}>Pending</option>
          <option value="under_review" ${workerStatusFilter === "under_review" ? "selected" : ""}>Under Review</option>
        </select>
      </div>

      ${filtered.length === 0 ? `
        <div class="empty-state">No workers match the selected filters.</div>
      ` : `
        <table class="hs-table">
          <thead>
            <tr>
              <th>Member Name</th>
              <th>Category</th>
              <th>Cooperative ID</th>
              <th>Rating</th>
              <th>Completed Jobs</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            ${filtered.map(w => `
              <tr>
                <td><b>${w.name}</b></td>
                <td>${getCategory(w.category)?.label || w.category}</td>
                <td><code style="font-size:0.8rem">${w.cooperativeMemberId || "SEVA-COOP"}</code></td>
                <td>${stars(w.rating || 4.8)} ${w.rating || 4.8}</td>
                <td>${w.completedJobs || 0}</td>
                <td>${verificationBadge(w.verificationStatus || "pending")}</td>
                <td><button class="btn btn-ghost btn-sm btn-inspect-worker" data-id="${w.id}">Inspect</button></td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `}
    `;

    document.getElementById("worker-search")?.addEventListener("input", (e) => {
      workerSearchQuery = e.target.value.trim().toLowerCase();
      renderWorkers();
    });
    document.getElementById("worker-cat-filter")?.addEventListener("change", (e) => {
      workerCategoryFilter = e.target.value;
      renderWorkers();
    });
    document.getElementById("worker-status-filter")?.addEventListener("change", (e) => {
      workerStatusFilter = e.target.value;
      renderWorkers();
    });

    el.querySelectorAll(".btn-inspect-worker").forEach(btn => {
      btn.addEventListener("click", () => {
        const w = getWorkerById(btn.dataset.id);
        if (!w) return;
        openModal(`
          <h3 style="margin-bottom:12px">👤 Worker Profile: ${w.name}</h3>
          <p style="font-size:0.85rem;color:var(--muted);margin-bottom:14px">Cooperative ID: <b>${w.cooperativeMemberId || "SEVA-COOP"}</b></p>
          <div style="background:var(--surface2);padding:14px;border-radius:10px;margin-bottom:16px;font-size:0.88rem;line-height:1.6">
            <div><b>Trade Category:</b> ${getCategory(w.category)?.label || w.category}</div>
            <div><b>Phone:</b> ${w.phone || "—"} · <b>Email:</b> ${w.email || "—"}</div>
            <div><b>Address:</b> ${w.address || "Guwahati"} (Radius: ${w.serviceRadiusKm || 10} km)</div>
            <div><b>Experience:</b> ${w.experience || 0} years · <b>Qualification:</b> ${w.qualification || "Trade Certified"}</div>
            <div><b>Certifications:</b> ${(w.certifications || []).join(", ") || "None"}</div>
            <div><b>Skills:</b> ${(w.skills || []).join(", ") || "General"}</div>
            <div><b>Expected Rate:</b> ${money(w.expectedRate || 400)} / job</div>
            <div><b>Insurance:</b> ${badge(w.welfare?.insurance || "pending", w.welfare?.insurance === "covered" ? "success" : "warn")}</div>
          </div>
          <div style="display:flex;gap:10px;justify-content:flex-end">
            <button class="btn btn-ghost btn-sm" onclick="document.getElementById('modal-container').innerHTML=''">Close</button>
            ${w.verificationStatus !== "verified" ? `
              <button class="btn btn-primary btn-sm btn-verify-direct" data-id="${w.id}">✓ Verify Member</button>
            ` : ""}
          </div>
        `);
        document.querySelector(".btn-verify-direct")?.addEventListener("click", () => {
          setWorkerVerification(w.id, "verified");
          closeModal();
          showToast(`Worker ${w.name} verified successfully!`, "✓");
          renderAll();
        });
      });
    });
  } catch (err) {
    console.error("renderWorkers error:", err);
  }
}

function renderVerification() {
  const el = document.getElementById("tab-verification");
  if (!el) return;

  try {
    const workers = getWorkers().filter(w => w.verificationStatus !== "verified" && w.verificationStatus !== "rejected");

    el.innerHTML = workers.length === 0 ? `
      <div class="empty-state">
        <div style="font-size:2.5rem;margin-bottom:10px">🎉</div>
        <h3>No Pending Verifications</h3>
        <p style="color:var(--muted);margin-top:6px">All cooperative worker profiles are reviewed and verified.</p>
      </div>
    ` : `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px">
        <p style="color:var(--muted);font-size:0.9rem"><b>${workers.length}</b> workers awaiting credentials audit and ID verification.</p>
        <button class="btn btn-primary btn-sm" id="btn-verify-all">⚡ Approve & Verify All</button>
      </div>
      <div class="grid grid-2">
        ${workers.map(w => `
          <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:flex-start">
              <div>
                <b>${w.name}</b>
                <div style="color:var(--muted);font-size:0.83rem;margin-top:2px">ID: ${w.cooperativeMemberId || "SEVA-COOP"}</div>
              </div>
              ${verificationBadge(w.verificationStatus || "pending")}
            </div>
            <p style="color:var(--muted);font-size:0.85rem;margin-top:8px">
              ${getCategory(w.category)?.label || w.category} · ${w.experience || 1} yrs exp · ${w.qualification || "Trade Trained"}
            </p>
            <p style="font-size:0.85rem;margin-top:6px">
              <b>Certifications:</b> ${(w.certifications || []).join(", ") || "Trade Certificate"}
            </p>
            <p style="font-size:0.85rem;margin-top:2px">
              <b>Location:</b> ${w.address || "Guwahati"}
            </p>
            <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
              <button class="btn btn-primary btn-sm" data-id="${w.id}" data-status="verified">✓ Verify</button>
              <button class="btn btn-ghost btn-sm" data-id="${w.id}" data-status="under_review">🔍 Under Review</button>
              <button class="btn btn-ghost btn-sm" data-id="${w.id}" data-status="rejected" style="color:var(--danger)">✕ Reject</button>
            </div>
          </div>
        `).join("")}
      </div>`;

    el.querySelectorAll("[data-status]").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = btn.dataset.id;
        const st = btn.dataset.status;
        setWorkerVerification(id, st);
        showToast(`Worker status updated to "${st.replace("_", " ")}"`, "✓");
        renderAll();
      });
    });

    document.getElementById("btn-verify-all")?.addEventListener("click", () => {
      workers.forEach(w => setWorkerVerification(w.id, "verified"));
      showToast(`Verified all ${workers.length} pending workers!`, "✓");
      renderAll();
    });
  } catch (err) {
    console.error("renderVerification error:", err);
  }
}

const statusTone = {
  requested: "warn",
  accepted: "info",
  scheduled: "info",
  in_progress: "info",
  completed: "success",
  rejected: "danger",
  cancelled: "muted"
};

let bookingFilter = "all";

function renderBookings() {
  const el = document.getElementById("tab-bookings");
  if (!el) return;

  try {
    const allBookings = getBookings().sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    let filtered = allBookings;
    if (bookingFilter === "emergency") filtered = allBookings.filter(b => b.isEmergency);
    else if (bookingFilter === "active") filtered = allBookings.filter(b => ["requested", "accepted", "in_progress", "scheduled"].includes(b.status));
    else if (bookingFilter === "completed") filtered = allBookings.filter(b => b.status === "completed");

    el.innerHTML = `
      <div class="filter-chip-bar">
        <span class="filter-chip ${bookingFilter === "all" ? "active" : ""}" data-bf="all">All Bookings (${allBookings.length})</span>
        <span class="filter-chip ${bookingFilter === "emergency" ? "active" : ""}" data-bf="emergency">🚨 Emergency (${allBookings.filter(b => b.isEmergency).length})</span>
        <span class="filter-chip ${bookingFilter === "active" ? "active" : ""}" data-bf="active">⚡ Active / In Progress (${allBookings.filter(b => ["requested", "accepted", "in_progress", "scheduled"].includes(b.status)).length})</span>
        <span class="filter-chip ${bookingFilter === "completed" ? "active" : ""}" data-bf="completed">✓ Completed (${allBookings.filter(b => b.status === "completed").length})</span>
      </div>

      <table class="hs-table">
        <thead>
          <tr>
            <th>Customer</th>
            <th>Worker</th>
            <th>Category</th>
            <th>Date</th>
            <th>Amount</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          ${filtered.slice(0, 60).map(b => {
            const st = b.status ? b.status.replace("_", " ") : "pending";
            const tone = statusTone[b.status] || "muted";
            return `
            <tr>
              <td><b>${b.customerName || "Customer"}</b></td>
              <td>${b.workerName || "Worker"}</td>
              <td>${b.category || "Service"}${b.isEmergency ? " 🚨" : ""}</td>
              <td>${b.date || "Recent"}</td>
              <td style="font-weight:700">${money(b.serviceCharge || 0)}</td>
              <td>${badge(st, tone)}</td>
              <td><a href="invoice.html?booking=${b.id}" class="btn btn-ghost btn-sm" target="_blank">📄 Invoice</a></td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>
    `;

    el.querySelectorAll("[data-bf]").forEach(chip => {
      chip.addEventListener("click", () => {
        bookingFilter = chip.dataset.bf;
        renderBookings();
      });
    });
  } catch (err) {
    console.error("renderBookings error:", err);
  }
}

function renderPayments() {
  const el = document.getElementById("tab-payments");
  if (!el) return;

  try {
    const payments = getPayments().sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    const totalRev = payments.filter(p => p.status === "success").reduce((s, p) => s + (Number(p.amount) || 0), 0);
    const coopFee = Math.round(totalRev * 0.08); // 8% fee
    const welfareFund = Math.round(totalRev * 0.03); // 3% fund

    el.innerHTML = `
      <div class="grid grid-3" style="margin-bottom:20px">
        <div class="card stat-card">
          <div class="stat-value">${money(totalRev)}</div>
          <div class="stat-label">Gross Platform Volume</div>
        </div>
        <div class="card stat-card">
          <div class="stat-value">${money(coopFee)}</div>
          <div class="stat-label">8% Cooperative Admin Pool</div>
        </div>
        <div class="card stat-card">
          <div class="stat-value">${money(welfareFund)}</div>
          <div class="stat-label">3% Accrued Welfare Fund</div>
        </div>
      </div>

      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px">
        <h3 style="margin:0">Settlement Transactions</h3>
        <button class="btn btn-ghost btn-sm" id="btn-export-csv">📥 Export Payout Ledger (CSV)</button>
      </div>

      <table class="hs-table">
        <thead>
          <tr>
            <th>Transaction ID</th>
            <th>Method</th>
            <th>Amount</th>
            <th>Status</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody>
          ${payments.slice(0, 60).map(p => `
            <tr>
              <td><code>${p.transactionId || p.id}</code></td>
              <td>${p.method === "cash" ? "Cash on Delivery" : "Online UPI"}</td>
              <td style="font-weight:700">${money(p.amount || 0)}</td>
              <td>${badge(p.status || "success", p.status === "success" ? "success" : p.status === "failed" ? "danger" : "warn")}</td>
              <td>${p.createdAt ? new Date(p.createdAt).toLocaleDateString() : "Recent"}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    `;

    document.getElementById("btn-export-csv")?.addEventListener("click", () => {
      showToast("Payout ledger CSV exported to downloads!", "📥");
    });
  } catch (err) {
    console.error("renderPayments error:", err);
  }
}

function renderWelfare() {
  const el = document.getElementById("tab-welfare");
  if (!el) return;

  try {
    const workers = getWorkers();
    const covered = workers.filter(w => w.welfare?.insurance === "covered").length;
    const coveragePct = workers.length ? Math.round((covered / workers.length) * 100) : 0;
    const claims = getWelfareClaims();

    el.innerHTML = `
      <div class="grid grid-4" style="margin-bottom:16px">
        <div class="card stat-card"><div class="stat-value">${workers.length}</div><div class="stat-label">Total Workers</div></div>
        <div class="card stat-card"><div class="stat-value">${covered}</div><div class="stat-label">Insurance Covered</div></div>
        <div class="card stat-card"><div class="stat-value">${workers.filter(w => w.welfare?.scheme === "enrolled").length}</div><div class="stat-label">Pension Scheme Enrolled</div></div>
        <div class="card stat-card"><div class="stat-value">${money(18400)}</div><div class="stat-label">Accrued Welfare Pool</div></div>
      </div>

      <div class="card" style="margin-bottom:20px">
        <div style="display:flex;justify-content:space-between;font-size:0.85rem;margin-bottom:6px">
          <b>Overall Cooperative Health Insurance Coverage</b>
          <span>${coveragePct}%</span>
        </div>
        <div class="hs-bar-track" style="--bar-pct:${coveragePct}%"><div class="hs-bar-fill" style="background:var(--success)"></div></div>
      </div>

      <h3 style="margin:20px 0 10px">Welfare Claims & Equipment Advances</h3>
      ${claims.length === 0 ? `<div class="empty-state" style="padding:16px">No welfare claims pending.</div>` : `
        <table class="hs-table" style="margin-bottom:28px">
          <thead>
            <tr>
              <th>Worker Name</th>
              <th>Claim Type</th>
              <th>Amount</th>
              <th>Hospital / Vendor</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            ${claims.map(c => `
              <tr>
                <td><b>${c.workerName}</b></td>
                <td>${c.type}</td>
                <td style="font-weight:700">${money(c.amount)}</td>
                <td style="font-size:0.82rem;color:var(--muted)">${c.hospital || "—"}</td>
                <td>${badge(c.status === "approved" ? "Approved" : c.status === "rejected" ? "Rejected" : "Pending Approval", c.status === "approved" ? "success" : c.status === "rejected" ? "danger" : "warn")}</td>
                <td>
                  ${c.status === "pending" ? `
                    <button class="btn btn-primary btn-sm btn-approve-claim" data-id="${c.id}">✓ Approve</button>
                    <button class="btn btn-ghost btn-sm btn-reject-claim" data-id="${c.id}">✕ Reject</button>
                  ` : `<span style="font-size:0.8rem;color:var(--muted)">Settled</span>`}
                </td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `}

      <h3 style="margin:20px 0 10px">Worker Welfare Coverage Roster</h3>
      <table class="hs-table">
        <thead>
          <tr>
            <th>Worker</th>
            <th>Insurance Status</th>
            <th>Social Scheme</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          ${workers.map(w => `
            <tr>
              <td><b>${w.name}</b></td>
              <td>${badge(w.welfare?.insurance || "pending", w.welfare?.insurance === "covered" ? "success" : "warn")}</td>
              <td>${badge(w.welfare?.scheme || "pending", w.welfare?.scheme === "enrolled" ? "success" : "warn")}</td>
              <td>
                <button class="btn btn-ghost btn-sm" data-cover="${w.id}">
                  ${w.welfare?.insurance === "covered" ? "Mark Pending" : "Mark Covered"}
                </button>
              </td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    `;

    el.querySelectorAll(".btn-approve-claim").forEach(btn => {
      btn.addEventListener("click", () => {
        updateWelfareClaim(btn.dataset.id, "approved", "Approved by Cooperative Welfare Committee.");
        showToast("Claim approved and disbursed to worker bank account!", "✓");
        renderWelfare();
      });
    });

    el.querySelectorAll(".btn-reject-claim").forEach(btn => {
      btn.addEventListener("click", () => {
        updateWelfareClaim(btn.dataset.id, "rejected", "Documentation insufficient.");
        showToast("Claim rejected.", "ℹ️");
        renderWelfare();
      });
    });

    el.querySelectorAll("[data-cover]").forEach(btn => {
      btn.addEventListener("click", () => {
        const w = workers.find(x => x.id === btn.dataset.cover);
        if (!w) return;
        updateWelfare(w.id, { insurance: w.welfare?.insurance === "covered" ? "pending" : "covered" });
        showToast(`Insurance coverage updated for ${w.name}`, "🔄");
        renderAll();
      });
    });
  } catch (err) {
    console.error("renderWelfare error:", err);
  }
}

function renderForecast() {
  const el = document.getElementById("tab-forecast");
  if (!el) return;

  try {
    const forecast = demandForecast();
    const maxBookings = Math.max(1, ...forecast.map(f => f.recentBookings));

    el.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px">
        <p class="ai-note" style="margin:0">Statistical 14-day trailing demand model mapped against cooperative category workload.</p>
        <button class="btn btn-ghost btn-sm" id="btn-simulate-surge">🌦️ Simulate Monsoon / Festival Surge</button>
      </div>

      <div class="grid grid-2">
        ${forecast.map(f => `
          <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <div>
                <b>${f.icon} ${f.label}</b>
                <div style="color:var(--muted);font-size:0.82rem">
                  ${f.recentBookings} bookings in last 14 days · ${f.growthPct >= 0 ? "+" : ""}${f.growthPct}% vs prior period
                </div>
              </div>
              ${badge(f.level, f.level === "Very High" || f.level === "High" ? "danger" : f.level === "Medium" ? "warn" : "muted")}
            </div>
            <div class="hs-bar-track" style="--bar-pct:${Math.round((f.recentBookings / maxBookings) * 100)}%">
              <div class="hs-bar-fill" style="background:${f.level === "Very High" || f.level === "High" ? "var(--danger)" : f.level === "Medium" ? "var(--coop-amber)" : "var(--muted)"}"></div>
            </div>
          </div>
        `).join("")}
      </div>
    `;

    document.getElementById("btn-simulate-surge")?.addEventListener("click", () => {
      showToast("Simulated surge: 25 additional electrical & plumbing requests forecasted!", "🌦️");
    });
  } catch (err) {
    console.error("renderForecast error:", err);
  }
}

function renderAnalytics() {
  const el = document.getElementById("tab-analytics");
  if (!el) return;

  try {
    const recs = workforceAllocation();
    el.innerHTML = `
      <p class="ai-note" style="margin-bottom:16px">AI-assisted capacity recommendations — suggestions for the cooperative administrator to balance on-duty shifts across Guwahati zones.</p>
      <div class="card">
        <h3 style="margin-bottom:12px">Recommended Workforce Reallocation</h3>
        <ul style="padding-left:20px;line-height:2">
          ${recs.map(r => `<li><b>${r}</b></li>`).join("")}
        </ul>
        <div style="margin-top:16px">
          <button class="btn btn-primary btn-sm" id="btn-rebalance-shifts">⚡ Auto-Notify Available Workers</button>
        </div>
      </div>
    `;

    document.getElementById("btn-rebalance-shifts")?.addEventListener("click", () => {
      showToast("Dispatch notification sent to 6 standby workers to go online.", "⚡");
    });
  } catch (err) {
    console.error("renderAnalytics error:", err);
  }
}

function renderDisputes() {
  const el = document.getElementById("tab-disputes");
  if (!el) return;

  try {
    const disputes = getDisputes();
    el.innerHTML = disputes.length === 0 ? `<div class="empty-state">No active disputes filed 🎉</div>` : `
      <div class="grid grid-2">
        ${disputes.map(d => `
          <div class="card" style="margin-bottom:12px">
            <div style="display:flex;justify-content:space-between;align-items:flex-start">
              <div>
                <b>Booking ${d.bookingId}</b>
                <div style="color:var(--muted);font-size:0.83rem">Raised by: ${d.raisedBy || "Customer"}</div>
              </div>
              ${badge(d.status === "open" ? "Open Grievance" : "Resolved", d.status === "open" ? "warn" : "success")}
            </div>
            <p style="font-size:0.9rem;margin:10px 0;line-height:1.45">${d.reason}</p>
            ${d.status === "open" ? `
              <div style="display:flex;gap:8px;margin-top:10px">
                <button class="btn btn-primary btn-sm btn-resolve-disp" data-id="${d.id}">✓ Resolve Dispute</button>
                <button class="btn btn-ghost btn-sm btn-credit-disp" data-id="${d.id}">Issue ₹150 Credit</button>
              </div>
            ` : `
              <div style="background:var(--surface2);padding:8px 12px;border-radius:8px;font-size:0.82rem;color:var(--muted);margin-top:8px">
                <b>Resolution:</b> ${d.resolution || "Resolved by cooperative mediation."}
              </div>
            `}
          </div>
        `).join("")}
      </div>
    `;

    el.querySelectorAll(".btn-resolve-disp").forEach(btn => {
      btn.addEventListener("click", () => {
        openModal(`
          <h3 style="margin-bottom:12px">⚖️ Resolve Customer Grievance</h3>
          <p style="font-size:0.85rem;color:var(--muted);margin-bottom:14px">Select resolution type or enter mediation note:</p>
          <div class="form-group">
            <label>Resolution Action</label>
            <select class="form-control" id="disp-action">
              <option value="Worker revisited and corrected issue free of charge. Customer satisfied.">Worker Revisited & Fixed Without Fee</option>
              <option value="Cancellation charge waived due to unavoidable weather delay.">Waived Cancellation Fee</option>
              <option value="Material billing discrepancy adjusted and refunded.">Refunded Material Discrepancy</option>
              <option value="Mediation completed with mutual agreement.">Mutual Cooperative Mediation</option>
            </select>
          </div>
          <div style="display:flex;gap:10px;justify-content:flex-end">
            <button class="btn btn-ghost btn-sm" onclick="document.getElementById('modal-container').innerHTML=''">Cancel</button>
            <button class="btn btn-primary btn-sm" id="btn-confirm-disp">Apply Resolution</button>
          </div>
        `);
        document.getElementById("btn-confirm-disp")?.addEventListener("click", () => {
          const actionNote = document.getElementById("disp-action").value;
          resolveDispute(btn.dataset.id, actionNote);
          closeModal();
          showToast("Dispute marked resolved!", "✓");
          renderDisputes();
        });
      });
    });

    el.querySelectorAll(".btn-credit-disp").forEach(btn => {
      btn.addEventListener("click", () => {
        resolveDispute(btn.dataset.id, "Issued ₹150 platform courtesy credit to customer.");
        showToast("Courtesy credit issued & dispute resolved!", "💳");
        renderDisputes();
      });
    });
  } catch (err) {
    console.error("renderDisputes error:", err);
  }
}

function renderCategories() {
  const el = document.getElementById("tab-categories");
  if (!el) return;

  try {
    const bookings = getBookings();
    const configs = getAllCategoryConfigs();

    el.innerHTML = `
      <p class="ai-note" style="margin-bottom:16px">Cooperative categories and fair-wage settings. Changes update live across the marketplace without code deploys.</p>
      <div class="grid grid-2">
        ${configs.map(c => `
          <div class="card" style="border-top:4px solid ${c.theme?.accent || "#065f46"}">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <b>${c.icon || "🛠️"} ${c.label}</b>
              ${badge(c.active ? "Active" : "Deactivated", c.active ? "success" : "muted")}
            </div>
            <div class="form-group" style="margin-top:10px">
              <label>Tagline</label>
              <input class="form-control" data-cat="${c.id}" data-field="tagline" value="${c.tagline || ""}" />
            </div>
            <div class="form-group">
              <label>Description</label>
              <textarea class="form-control" data-cat="${c.id}" data-field="description">${c.description || ""}</textarea>
            </div>
            <div class="form-group">
              <label>Accent Color</label>
              <input type="color" data-cat="${c.id}" data-field="accent" value="${c.theme?.accent || "#065f46"}" style="width:60px;height:36px;padding:2px" />
            </div>
            <div style="display:flex;gap:8px;margin-top:10px">
              <button class="btn btn-primary btn-sm" data-save="${c.id}">Save Changes</button>
              <button class="btn btn-ghost btn-sm" data-toggle="${c.id}">${c.active ? "Deactivate" : "Reactivate"}</button>
            </div>
            ${!canDeleteCategory(c.id, bookings) ? `
              <p style="font-size:0.78rem;color:var(--muted);margin-top:6px">Category has historical bookings (deactivation preserved).</p>
            ` : ""}
          </div>
        `).join("")}
      </div>
    `;

    el.querySelectorAll("[data-save]").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = btn.dataset.save;
        const card = btn.closest(".card");
        const tagline = card.querySelector('[data-field="tagline"]').value;
        const description = card.querySelector('[data-field="description"]').value;
        const accent = card.querySelector('[data-field="accent"]').value;
        saveCategoryOverride(id, { tagline, description, theme: { accent } });
        showToast("Category settings updated live!", "✓");
        renderAll();
      });
    });

    el.querySelectorAll("[data-toggle]").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = btn.dataset.toggle;
        const cfg = configs.find(c => c.id === id);
        if (cfg) {
          setCategoryActive(id, !cfg.active);
          showToast(`Category ${!cfg.active ? "reactivated" : "deactivated"}`, "🔄");
          renderAll();
        }
      });
    });
  } catch (err) {
    console.error("renderCategories error:", err);
  }
}

function renderAll() {
  renderStats();
  renderWorkers();
  renderVerification();
  renderBookings();
  renderPayments();
  renderWelfare();
  renderForecast();
  renderAnalytics();
  renderDisputes();
  renderCategories();
}

// Initial render
renderAll();
</script>
</body>
</html>
